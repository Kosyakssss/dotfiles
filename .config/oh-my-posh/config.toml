version = 4
final_space = false

[palette]
black = '#100F0F'
gray = '#6F6E69'
green = '#879A39'
red = '#AF3029'
yellow = '#AD8301'

[secondary_prompt]
template = '> '
foreground = 'p:green'
background = 'transparent'

[transient_prompt]
template = '{{ .Segments.Path.Path }}> '
foreground = 'p:green'
background = 'transparent'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'path'
style = 'plain'
template = '<p:green>{{ path .Path .Location }}</> '

[blocks.segments.options]
style = 'fish'
dir_length = 1
full_length_dirs = 1

[[blocks.segments]]
type = 'jujutsu'
style = 'plain'
template = '{{ if .ClosestBookmarks }}({{ .ClosestBookmarks }}) {{ end }}{{ .ChangeID }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}'
foreground = 'p:green'
foreground_templates = ['{{ if .Working.Changed }}p:yellow{{ end }}']

[blocks.segments.options]
change_id_min_len = 8
fetch_status = true
ignore_working_copy = false

[[blocks.segments]]
type = 'git'
style = 'plain'
template = '{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}'
foreground = 'p:green'
foreground_templates = ['{{ if or .Working.Changed .Staging.Changed }}p:yellow{{ end }}']

[blocks.segments.options]
disable_with_jj = true
fetch_status = true

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
template = '{{ if gt .Code 0 }}<p:red>[{{ .Code }}]></>{{ else }}<p:green>></>{{ end }} '
